<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Director Dashboard</title><link rel="stylesheet" href="style.css"></head><body><div class="top"><div class="brand">CNC PM Management System</div><div>Director / Maintenance</div></div><div class="nav"><a href="index.html">Dashboard</a><a href="machines.html">Machines</a><a href="add-machine.html">Add Machine</a><a href="pm-planning.html">PM Planning</a><a href="maintenance.html">Maintenance</a><a href="spare-parts.html">Spare Parts</a><a href="accuracy.html">Accuracy</a><a href="reports.html">Reports</a></div><main class="wrap"><h1>Director Dashboard</h1>
<div id="msg" class="msg"></div><div class="grid" id="kpis"></div>
<div class="section card"><h2>Recent PM</h2><div class="tablewrap"><table><thead><tr><th>PM ID</th><th>Asset</th><th>Machine</th><th>Status</th><th>Planned Date</th></tr></thead><tbody id="recent"></tbody></table></div></div>
</main><script src="api.js"></script><script>
async function load(){try{let x=await apiGet("dashboard");let d=x.dashboard||x.data||x;let items=[["Total Machines",d.totalMachines||0],["Active Machines",d.activeMachines||0],["PM Planned",d.plannedPM||0],["In Progress",d.inProgressPM||0],["Completed PM",d.completedPM||0],["Overdue",d.overduePM||0],["Parts Pending",d.partsNotOrdered||0],["Parts Received",d.partsReceived||0]];document.getElementById("kpis").innerHTML=items.map(a=>`<div class="card kpi"><span class="muted">${a[0]}</span><b>${a[1]}</b></div>`).join("");let rows=d.recentPM||[];document.getElementById("recent").innerHTML=rows.map(r=>`<tr><td>${esc(r.pmId||r.PM_ID)}</td><td>${esc(r.assetNumber||r.Asset_Number)}</td><td>${esc(r.machineName||r.Machine_Name)}</td><td>${esc(r.status||r.Status)}</td><td>${esc(r.plannedDate||r.Planned_Date)}</td></tr>`).join("")}catch(e){msg(e.message,false)}}load();
</script></body></html>
