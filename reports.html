<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports</title><link rel="stylesheet" href="style.css"></head><body><div class="top"><div class="brand">CNC PM Management System</div><div>Director / Maintenance</div></div><div class="nav"><a href="index.html">Dashboard</a><a href="machines.html">Machines</a><a href="add-machine.html">Add Machine</a><a href="pm-planning.html">PM Planning</a><a href="maintenance.html">Maintenance</a><a href="spare-parts.html">Spare Parts</a><a href="accuracy.html">Accuracy</a><a href="reports.html">Reports</a></div><main class="wrap"><h1>Reports</h1>
<div class="card"><div class="search"><input id="asset" placeholder="Asset Number (optional)"><button class="btn" onclick="load()">Load Report</button><button class="btn secondary" onclick="window.print()">Print / Save PDF</button></div><div id="report"></div></div>
</main><script src="api.js"></script><script>
async function load(){let a=document.getElementById("asset").value.trim();try{let r=a?await apiGet("machine",{assetNumber:a}):await apiGet("machines");let x=a?(r.machine||r.data||r):(r.machines||r.data||r||[]);if(a)x=[x];document.getElementById("report").innerHTML=`<div class="tablewrap"><table><thead><tr><th>Asset</th><th>Machine</th><th>Category</th><th>Type</th><th>Manufacturer</th><th>Model</th><th>Shop</th><th>Status</th></tr></thead><tbody>${x.map(v=>`<tr><td>${esc(v.assetNumber||v.Asset_Number)}</td><td>${esc(v.machineName||v.Machine_Name)}</td><td>${esc(v.machineCategory||v.Category)}</td><td>${esc(v.machineType||v.Machine_Type)}</td><td>${esc(v.manufacturer||v.Manufacturer)}</td><td>${esc(v.model||v.Model)}</td><td>${esc(v.machineShop||v.Machine_Shop)}</td><td>${esc(v.status||v.Status)}</td></tr>`).join("")}</tbody></table></div>`}catch(e){msg(e.message,false)}}load();
</script></body></html>
