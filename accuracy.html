<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine Accuracy</title><link rel="stylesheet" href="css/style.css"></head><body><div class="top"><div class="brand">CNC PM Management System</div><div>Director / Maintenance</div></div><div class="nav"><a href="index.html">Dashboard</a><a href="machines.html">Machines</a><a href="add-machine.html">Add Machine</a><a href="pm-planning.html">PM Planning</a><a href="maintenance.html">Maintenance</a><a href="spare-parts.html">Spare Parts</a><a href="accuracy.html">Accuracy</a><a href="reports.html">Reports</a></div><main class="wrap"><h1>Machine Accuracy</h1>
<div id="msg" class="msg"></div><div class="card"><div class="search"><input id="asset" placeholder="Asset Number"><button class="btn" onclick="find()">Load Machine</button></div><div id="machine"></div></div>
<div id="box" class="card section hidden"><form id="f" class="form"><input type="hidden" name="assetNumber" id="a"><div class="field"><label>PM ID</label><input name="pmId"></div><div class="field"><label>Axis</label><select name="axis"><option>X</option><option>Y</option><option>Z</option><option>A</option><option>B</option><option>C</option><option>Spindle</option><option>Other</option></select></div><div class="field"><label>Test Parameter</label><input name="parameter" placeholder="Position accuracy / backlash"></div><div class="field"><label>Test Method</label><input name="testMethod"></div><div class="field"><label>Before</label><input name="beforeValue"></div><div class="field"><label>After</label><input name="afterValue"></div><div class="field"><label>Tolerance</label><input name="tolerance"></div><div class="field"><label>Result</label><select name="result"><option>PASS</option><option>FAIL</option><option>Observation</option></select></div><div class="field"><label>Technician</label><input name="technician"></div><div class="field full"><label>Remarks</label><textarea name="remarks"></textarea></div></form><div class="actions"><button class="btn success" onclick="save()">Save Accuracy</button></div></div>
</main><script src="js/api.js"></script><script>
async function find(){let a=document.getElementById("asset").value.trim();try{let r=await apiGet("machine",{assetNumber:a});let x=r.machine||r.data||r;if(!x||(!x.assetNumber&&!x.Asset_Number))throw Error("Machine not found");document.getElementById("a").value=a;document.getElementById("machine").innerHTML=`<p><b>${esc(x.machineName||x.Machine_Name)}</b> — Asset ${esc(a)}</p>`;document.getElementById("box").classList.remove("hidden")}catch(e){msg(e.message,false)}}async function save(){let d=Object.fromEntries(new FormData(document.getElementById("f")).entries());try{let r=await apiPost("accuracy",d);if(r.success===false)throw Error(r.message||"Save failed");msg("Accuracy record saved")}catch(e){msg(e.message,false)}}
</script></body></html>
