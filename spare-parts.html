<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spare Parts</title><link rel="stylesheet" href="css/style.css"></head><body><div class="top"><div class="brand">CNC PM Management System</div><div>Director / Maintenance</div></div><div class="nav"><a href="index.html">Dashboard</a><a href="machines.html">Machines</a><a href="add-machine.html">Add Machine</a><a href="pm-planning.html">PM Planning</a><a href="maintenance.html">Maintenance</a><a href="spare-parts.html">Spare Parts</a><a href="accuracy.html">Accuracy</a><a href="reports.html">Reports</a></div><main class="wrap"><h1>Spare Parts</h1>
<div id="msg" class="msg"></div><div class="card"><div class="search"><input id="asset" placeholder="Asset Number"><button class="btn" onclick="find()">Load Machine</button></div><div id="machine"></div></div>
<div id="box" class="card section hidden"><form id="f" class="form"><input type="hidden" name="assetNumber" id="a"><div class="field"><label>Part Name *</label><input name="partName" required></div><div class="field"><label>Part Number</label><input name="partNumber"></div><div class="field"><label>Quantity</label><input name="quantity" type="number" value="1"></div><div class="field"><label>Supplier</label><input name="supplier"></div><div class="field"><label>Required Date</label><input name="requiredDate" type="date"></div><div class="field"><label>Order Status</label><select name="orderStatus"><option>Not Ordered</option><option>Ordered</option><option>Received</option><option>Installed</option></select></div><div class="field"><label>Order Date</label><input name="orderDate" type="date"></div><div class="field"><label>Received Date</label><input name="receivedDate" type="date"></div><div class="field full"><label>Remarks</label><textarea name="remarks"></textarea></div></form><div class="actions"><button class="btn success" onclick="save()">Save Part</button></div></div>
</main><script src="js/api.js"></script><script>
async function find(){let a=document.getElementById("asset").value.trim();try{let r=await apiGet("machine",{assetNumber:a});let x=r.machine||r.data||r;if(!x||(!x.assetNumber&&!x.Asset_Number))throw Error("Machine not found");document.getElementById("a").value=a;document.getElementById("machine").innerHTML=`<p><b>${esc(x.machineName||x.Machine_Name)}</b> — ${esc(x.machineType||x.Machine_Type)} — ${esc(x.manufacturer||x.Manufacturer)}</p>`;document.getElementById("box").classList.remove("hidden")}catch(e){msg(e.message,false)}}async function save(){let d=Object.fromEntries(new FormData(document.getElementById("f")).entries());try{let r=await apiPost("addPart",d);if(r.success===false)throw Error(r.message||"Save failed");msg("Part saved");document.getElementById("f").reset()}catch(e){msg(e.message,false)}}
</script></body></html>
