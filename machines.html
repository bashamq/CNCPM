<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine Management</title><link rel="stylesheet" href="style.css"></head><body><div class="top"><div class="brand">CNC PM Management System</div><div>Director / Maintenance</div></div><div class="nav"><a href="index.html">Dashboard</a><a href="machines.html">Machines</a><a href="add-machine.html">Add Machine</a><a href="pm-planning.html">PM Planning</a><a href="maintenance.html">Maintenance</a><a href="spare-parts.html">Spare Parts</a><a href="accuracy.html">Accuracy</a><a href="reports.html">Reports</a></div><main class="wrap"><h1>Machine Management</h1>
<div class="card"><div class="search"><input id="q" placeholder="Search Asset Number / Machine Name"><button class="btn" onclick="load()">Search</button></div><div class="tablewrap"><table><thead><tr><th>Asset</th><th>Machine</th><th>Category</th><th>Type</th><th>Manufacturer</th><th>Shop</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main><script src="api.js"></script><script>
async function load(){try{let r=await apiGet("machines");let a=r.machines||r.data||r||[];let q=document.getElementById("q").value.toLowerCase();a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById("rows").innerHTML=a.map(x=>`<tr><td>${esc(x.assetNumber||x.Asset_Number)}</td><td>${esc(x.machineName||x.Machine_Name)}</td><td>${esc(x.machineCategory||x.Category)}</td><td>${esc(x.machineType||x.Machine_Type)}</td><td>${esc(x.manufacturer||x.Manufacturer)}</td><td>${esc(x.machineShop||x.Machine_Shop)}</td><td>${esc(x.status||x.Status)}</td></tr>`).join("")}catch(e){document.getElementById("rows").innerHTML=`<tr><td colspan=7>${esc(e.message)}</td></tr>`}}load();
</script></body></html>
