<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Machine</title><link rel="stylesheet" href="css/style.css"></head><body><div class="top"><div class="brand">CNC PM Management System</div><div>Director / Maintenance</div></div><div class="nav"><a href="index.html">Dashboard</a><a href="machines.html">Machines</a><a href="add-machine.html">Add Machine</a><a href="pm-planning.html">PM Planning</a><a href="maintenance.html">Maintenance</a><a href="spare-parts.html">Spare Parts</a><a href="accuracy.html">Accuracy</a><a href="reports.html">Reports</a></div><main class="wrap"><h1>Add Machine</h1>
<div id="msg" class="msg"></div><div class="card"><form id="f" class="form">
<div class="field"><label>Asset Number *</label><input name="assetNumber" required placeholder="CNC-001"></div>
<div class="field"><label>Machine Category *</label><select name="machineCategory" id="cat" required><option value="">Choose</option><option>CNC</option><option>Conventional</option></select></div>
<div class="field"><label>Machine Type *</label><select name="machineType" id="type" required><option value="">Choose</option><option>VMC</option><option>HMC</option><option>CNC Lathe</option><option>CNC Grinder</option><option>Lathe</option><option>Milling</option><option>Drilling</option><option>Grinding</option><option>Other</option></select></div>
<div class="field"><label>Machine Name *</label><input name="machineName" required></div><div class="field"><label>Manufacturer</label><input name="manufacturer"></div><div class="field"><label>Model</label><input name="model"></div>
<div class="field cnc"><label>Controller</label><select name="controller"><option>FANUC</option><option>Siemens</option><option>Mitsubishi</option><option>Heidenhain</option><option>Other</option></select></div>
<div class="field cnc"><label>No. of Axis</label><input name="axis"></div><div class="field"><label>Serial Number</label><input name="serialNumber"></div>
<div class="field"><label>Machine Shop</label><input name="machineShop"></div><div class="field"><label>Production Line</label><input name="productionLine"></div><div class="field"><label>Process / Operation</label><input name="process"></div>
<div class="field"><label>Power (kW)</label><input name="power" type="number" step="0.01"></div><div class="field"><label>Voltage (V)</label><input name="voltage"></div><div class="field"><label>Current (A)</label><input name="current"></div>
<div class="field"><label>Phase</label><select name="phase"><option>3 Phase</option><option>1 Phase</option></select></div><div class="field"><label>Status</label><select name="status"><option>Active</option><option>Under Maintenance</option><option>Idle</option><option>Decommissioned</option></select></div><div class="field"><label>Installation Year</label><input name="year"></div>
<div class="field full"><label>Remarks</label><textarea name="remarks"></textarea></div></form><div class="actions"><button class="btn success" onclick="save()">Save Machine</button><button class="btn secondary" onclick="document.getElementById('f').reset()">Reset</button></div></div>
</main><script src="js/api.js"></script><script>
document.getElementById("cat").onchange=()=>{document.querySelectorAll(".cnc").forEach(e=>e.style.display=document.getElementById("cat").value==="CNC"?"flex":"none")};
document.getElementById("cat").dispatchEvent(new Event("change"));
async function save(){let f=new FormData(document.getElementById("f"));let d=Object.fromEntries(f.entries());try{let r=await apiPost("addMachine",d);if(r.success===false)throw Error(r.message||"Save failed");msg("Machine saved successfully");document.getElementById("f").reset()}catch(e){msg(e.message,false)}}
</script></body></html>
