<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PM Planning</title><link rel="stylesheet" href="css/style.css"></head><body><div class="top"><div class="brand">CNC PM Management System</div><div>Director / Maintenance</div></div><div class="nav"><a href="index.html">Dashboard</a><a href="machines.html">Machines</a><a href="add-machine.html">Add Machine</a><a href="pm-planning.html">PM Planning</a><a href="maintenance.html">Maintenance</a><a href="spare-parts.html">Spare Parts</a><a href="accuracy.html">Accuracy</a><a href="reports.html">Reports</a></div><main class="wrap"><h1>PM Planning</h1>
<div id="msg" class="msg"></div><div class="card"><form id="f" class="form">
<div class="field"><label>Asset Number *</label><input id="asset" name="assetNumber" required placeholder="CNC-001"><button type="button" class="btn" onclick="findMachine()">Load Machine</button></div>
<div class="field"><label>Machine Name</label><input id="machineName" name="machineName" readonly></div><div class="field"><label>PM Type</label><select name="pmType"><option>Preventive</option><option>Monthly</option><option>Quarterly</option><option>Half Yearly</option><option>Annual</option></select></div>
<div class="field"><label>Planned Date</label><input name="plannedDate" type="date"></div><div class="field"><label>Priority</label><select name="priority"><option>Normal</option><option>High</option><option>Critical</option></select></div><div class="field"><label>Status</label><select name="status"><option>Planned</option><option>In Progress</option><option>Completed</option></select></div>
<div class="field full"><label>PM Work / Tasks</label><textarea name="tasks" placeholder="Lubrication, backlash check, spindle inspection..."></textarea></div><div class="field full"><label>Required Spare Parts</label><textarea name="parts" placeholder="Part name / part number / quantity"></textarea></div></form><div class="actions"><button class="btn success" onclick="save()">Create PM Plan</button></div></div>
<div class="section card"><h2>Existing PM Plans</h2><div class="tablewrap"><table><thead><tr><th>PM ID</th><th>Asset</th><th>Machine</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main><script src="js/api.js"></script><script>
async function findMachine(){let a=document.getElementById("asset").value.trim();if(!a)return;try{let r=await apiGet("machine",{assetNumber:a});let x=r.machine||r.data||r;if(!x||(!x.assetNumber&&!x.Asset_Number))throw Error("Machine not found");document.getElementById("machineName").value=x.machineName||x.Machine_Name||""}catch(e){msg(e.message,false)}}
async function save(){let d=Object.fromEntries(new FormData(document.getElementById("f")).entries());try{let r=await apiPost("addPM",d);if(r.success===false)throw Error(r.message||"Save failed");msg("PM plan saved");load()}catch(e){msg(e.message,false)}}
async function load(){try{let r=await apiGet("pmPlans");let a=r.pmPlans||r.data||r||[];document.getElementById("rows").innerHTML=a.map(x=>`<tr><td>${esc(x.pmId||x.PM_ID)}</td><td>${esc(x.assetNumber||x.Asset_Number)}</td><td>${esc(x.machineName||x.Machine_Name)}</td><td>${esc(x.status||x.Status)}</td><td>${esc(x.plannedDate||x.Planned_Date)}</td></tr>`).join("")}catch(e){}}load();
</script></body></html>
