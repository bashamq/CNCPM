<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maintenance Entry</title><link rel="stylesheet" href="style.css"></head><body><div class="top"><div class="brand">CNC PM Management System</div><div>Director / Maintenance</div></div><div class="nav"><a href="index.html">Dashboard</a><a href="machines.html">Machines</a><a href="add-machine.html">Add Machine</a><a href="pm-planning.html">PM Planning</a><a href="maintenance.html">Maintenance</a><a href="spare-parts.html">Spare Parts</a><a href="accuracy.html">Accuracy</a><a href="reports.html">Reports</a></div><main class="wrap"><h1>Maintenance Entry</h1>
<div id="msg" class="msg"></div><div class="card"><div class="search"><input id="asset" placeholder="Enter Asset Number e.g. CNC-001"><button class="btn" onclick="find()">Load Machine</button></div><div id="machine" class="card hidden"></div></div>
<div id="formbox" class="card section hidden"><form id="f" class="form"><input type="hidden" name="assetNumber" id="a"><div class="field"><label>PM ID</label><input name="pmId"></div><div class="field"><label>Technician</label><input name="technician"></div><div class="field"><label>Maintenance Date</label><input name="maintenanceDate" type="date"></div><div class="field"><label>Work Status</label><select name="status"><option>In Progress</option><option>Completed</option><option>Machine Hold</option></select></div><div class="field"><label>Start Time</label><input name="startTime" type="time"></div><div class="field"><label>End Time</label><input name="endTime" type="time"></div><div class="field full"><label>Work Performed</label><textarea name="workPerformed"></textarea></div><div class="field full"><label>Problems Found</label><textarea name="problemsFound"></textarea></div><div class="field full"><label>Corrective Action</label><textarea name="correctiveAction"></textarea></div><div class="field full"><label>Remarks</label><textarea name="remarks"></textarea></div></form><div class="actions"><button class="btn success" onclick="save()">Save Maintenance</button></div></div>
</main><script src="api.js"></script><script>
let machineData=null;async function find(){let a=document.getElementById("asset").value.trim();if(!a)return;try{let r=await apiGet("machine",{assetNumber:a});machineData=r.machine||r.data||r;if(!machineData||(!machineData.assetNumber&&!machineData.Asset_Number))throw Error("Asset Number not found");document.getElementById("a").value=a;document.getElementById("machine").classList.remove("hidden");document.getElementById("machine").innerHTML=`<b>${esc(machineData.machineName||machineData.Machine_Name)}</b><br>Asset: ${esc(machineData.assetNumber||machineData.Asset_Number)} | Type: ${esc(machineData.machineType||machineData.Machine_Type)} | Manufacturer: ${esc(machineData.manufacturer||machineData.Manufacturer)} | Shop: ${esc(machineData.machineShop||machineData.Machine_Shop)}`;document.getElementById("formbox").classList.remove("hidden")}catch(e){msg(e.message,false)}}async function save(){let d=Object.fromEntries(new FormData(document.getElementById("f")).entries());try{let r=await apiPost("maintenanceUpdate",d);if(r.success===false)throw Error(r.message||"Save failed");msg("Maintenance saved")}catch(e){msg(e.message,false)}}
</script></body></html>
